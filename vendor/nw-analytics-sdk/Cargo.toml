[package]
name = "nw-analytics-sdk"
description = "Transport and local picture sharing for NeuroWatch analytics daemons"
version = "0.1.6"
edition = "2021"
authors = ["Neurowatch Contributors"]
license = "Apache-2.0"
repository = "https://github.com/ttheekw/Neurowatch"
publish = false
rust-version = "1.75"
[dependencies]
nw-analytics-protocol = { path = "../nw-analytics-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
memmap2 = "0.9"
getrandom = { version = "0.2", features = ["std"] }
libc = "0.2"
subtle = "2.6"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
sha2 = "0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography"] }
