[package]
name        = "nw-analytics-protocol"
description = "The protocol between a NeuroWatch node and analytics plugin daemons"
version = "0.1.6"
edition = "2021"
authors = ["Neurowatch Contributors"]
license = "Apache-2.0"
repository = "https://github.com/ttheekw/Neurowatch"
publish = false
rust-version = "1.75"
# Plugins in other repositories depend on this crate by path or git: keep
# its dependencies few and free of NeuroWatch's own crates.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
