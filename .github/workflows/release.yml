name: Release

# Pushing a v* version tag builds, checks and publishes every release package.
# A manual run builds and checks the same packages and publishes nothing: they
# stay on the run's page as artifacts.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Test build version, for example v0.1.0-rc.1 (default: the version in Cargo.toml). Nothing is published.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      neurowatch-ref: ${{ steps.neurowatch.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A release builds only the library sources recorded in vendor/sources.sha256
      # (each crate's sources and Cargo.toml); an edit not recorded stops it here.
      - name: Included analytics libraries match vendor/sources.sha256
        run: sha256sum --check --strict vendor/sources.sha256
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          cargo_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          # A pushed tag is the version. A manual run takes the one entered,
          # else Cargo.toml's (its ref is a branch, not a version).
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${INPUT_VERSION:-v$cargo_version}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || {
            echo 'Expected vMAJOR.MINOR.PATCH, optionally followed by -rc.1'; exit 1;
          }
          base="${tag#v}"
          [[ "${base%%-*}" == "$cargo_version" ]] || {
            echo "::error::Tag $tag does not match Cargo.toml version $cargo_version"; exit 1;
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # The pinned NeuroWatch revision supplying the Linux GStreamer build.
      # Analytics library sources are included in this repository.
      - id: neurowatch
        run: echo "ref=$(tr -d '[:space:]' < neurowatch.ref)" >> "$GITHUB_OUTPUT"

  # Linux packages carry NeuroWatch's own GStreamer and LGPL FFmpeg build
  # (only the plugins the analysis uses). Built on Ubuntu 22.04 for both
  # architectures: glibc 2.35, so Ubuntu 22.04+, Debian 12+ and Raspberry Pi
  # OS (bookworm, 64-bit) run them.
  package-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: version
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            formats: portable,deb,rpm,arch
          # No Arch package: Arch Linux is x86_64 only.
          - arch: arm64
            runner: ubuntu-22.04-arm
            formats: portable,deb,rpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: Neurowatch-Motion
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ttheekw/Neurowatch
          ref: ${{ needs.version.outputs.neurowatch-ref }}
          path: Neurowatch
      # What NeuroWatch's GStreamer build needs (its release workflow's list,
      # without the desktop UI's libraries), and the package tools.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config nasm flex bison curl python3-venv \
            libglib2.0-dev liborc-0.4-dev libopus-dev libpulse-dev libasound2-dev \
            libva-dev libdrm-dev libgudev-1.0-dev libjpeg-dev librtmp-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxv-dev libgl-dev libegl-dev libgles-dev \
            libsoup-3.0-0 glib-networking \
            rpm libarchive-tools zstd dpkg-dev binutils
      - name: Restore the GStreamer build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: Neurowatch-Motion/build/gstreamer-sdk
          key: gstreamer-sdk-${{ matrix.runner }}-${{ hashFiles('Neurowatch/scripts/build_release_gstreamer.sh', 'Neurowatch/scripts/packaging/media-sources.sha256') }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Build packages
        working-directory: Neurowatch-Motion
        env:
          NEUROWATCH_DIR: ${{ github.workspace }}/Neurowatch
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          scripts/package_linux.sh \
            --version "$RELEASE_VERSION" \
            --arch "${{ matrix.arch }}" \
            --format "${{ matrix.formats }}" \
            --out-dir dist/release
      - name: Check the portable bundle
        working-directory: Neurowatch-Motion
        run: |
          mkdir -p "$RUNNER_TEMP/portable"
          tar -xzf dist/release/nw-motion-*-linux-*.tar.gz -C "$RUNNER_TEMP/portable"
          env -u GST_PLUGIN_PATH -u GST_PLUGIN_SYSTEM_PATH \
            "$RUNNER_TEMP/portable/nw-motion/nw-motion" --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: Neurowatch-Motion/dist/release/*
          if-no-files-found: error

  package-windows:
    name: Windows x86_64
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.version.outputs.tag }}

  install-linux:
    name: Install on ${{ matrix.image }} (${{ matrix.arch }})
    needs: package-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'ubuntu:22.04', digest: 'sha256:f64b2ffc2f10ab8f8505aa56b2664bd846cbb9df87c7e2532e30f7667021c0e6', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'ubuntu:24.04', digest: 'sha256:9c7f200c07e3d4a03e7249d2c16bf66a51120fb876aa2242cf31451412543289', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'debian:12', digest: 'sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'debian:13', digest: 'sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'fedora:43', digest: 'sha256:f01112b9a1f1d0504ad962d9adfa401425033f8ab067e0a821904ebdde5b8ca5', format: rpm, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'archlinux:base', digest: 'sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899', format: arch, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'ubuntu:22.04', digest: 'sha256:f64b2ffc2f10ab8f8505aa56b2664bd846cbb9df87c7e2532e30f7667021c0e6', format: deb, arch: arm64, runner: ubuntu-24.04-arm}
          - {image: 'debian:12', digest: 'sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8', format: deb, arch: arm64, runner: ubuntu-24.04-arm}
          - {image: 'debian:13', digest: 'sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6', format: deb, arch: arm64, runner: ubuntu-24.04-arm}
          - {image: 'fedora:43', digest: 'sha256:f01112b9a1f1d0504ad962d9adfa401425033f8ab067e0a821904ebdde5b8ca5', format: rpm, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release
      - name: Install, check, serve and remove in a clean distribution
        env:
          # The tag is for reading; the digest (the multi-architecture index)
          # is what is pulled. Refresh both together.
          IMAGE: ${{ matrix.image }}@${{ matrix.digest }}
          FORMAT: ${{ matrix.format }}
        run: |
          docker run --rm -v "$PWD:/work:ro" "$IMAGE" \
            bash /work/scripts/smoke_linux_package.sh "$FORMAT"

  publish:
    name: Publish GitHub Release
    needs: [version, package-linux, package-windows, install-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Keyless signing of SHA256SUMS (Sigstore, GitHub's OIDC token). Only
      # this job gets it.
      id-token: write
    steps:
      - name: Gather the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      # Stable names, so .../releases/latest/download/<name> always works.
      - name: Add version-free download names
        working-directory: dist/release
        run: |
          set -euo pipefail
          declare -A latest=(
            ['nw-motion-*-windows-x86_64.zip']=nw-motion-windows-x86_64.zip
            ['nw-motion-*-windows-x86_64-setup.exe']=nw-motion-windows-x86_64-setup.exe
            ['nw-motion_*_amd64.deb']=nw-motion_amd64.deb
            ['nw-motion_*_arm64.deb']=nw-motion_arm64.deb
            ['nw-motion-*.x86_64.rpm']=nw-motion.x86_64.rpm
            ['nw-motion-*.aarch64.rpm']=nw-motion.aarch64.rpm
            ['nw-motion-*-x86_64.pkg.tar.zst']=nw-motion-x86_64.pkg.tar.zst
            ['nw-motion-*-linux-x86_64.tar.gz']=nw-motion-linux-x86_64.tar.gz
            ['nw-motion-*-linux-arm64.tar.gz']=nw-motion-linux-arm64.tar.gz
          )
          for pattern in "${!latest[@]}"; do
            matches=($pattern)
            if [[ ${#matches[@]} -ne 1 || ! -f "${matches[0]}" ]]; then
              echo "expected one file for $pattern, found: ${matches[*]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "${latest[$pattern]}"
          done
          ls -la
      - name: Generate SHA256SUMS
        working-directory: dist/release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      # SHA256SUMS lists every package, so one signature covers them all. The
      # certificate names this workflow and the release tag; nothing to keep
      # secret. How to check it: README.md ("Check a download").
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign SHA256SUMS (keyless)
        working-directory: dist/release
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          test -s SHA256SUMS.sigstore.json
      - name: Create the release and upload the packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/release/*
            exit 0
          fi
          prerelease=()
          [[ "$RELEASE_TAG" == *-* ]] && prerelease=(--prerelease) || prerelease=(--latest)
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "NeuroWatch Motion $RELEASE_TAG" \
            --notes "The motion detection plugin for NeuroWatch. Packaged NeuroWatch already includes it; download this to run it on another computer or before the next NeuroWatch release. Installation: https://github.com/$GITHUB_REPOSITORY#download" \
            --generate-notes \
            "${prerelease[@]}" \
            dist/release/*
