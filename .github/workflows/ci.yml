name: CI

# Every push to main, every pull request to it, and manual runs: format, lint
# and all tests, using the included analytics libraries.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The included analytics libraries are unchanged copies of NeuroWatch's
      # (vendor/README.md); an edit to them must also update the checksums.
      - name: Included analytics libraries match vendor/sources.sha256
        run: sha256sum --check --strict vendor/sources.sha256
      # Development files, the elements the analysis uses (h264parse,
      # avdec_h264…) and those the tests encode with (x264enc).
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Evaluator tests
        run: python3 -m unittest discover -s tools/motion-eval -v
      - name: GStreamer has every element the analysis needs
        run: cargo run --locked --quiet -- --check
      - name: Packaging scripts
        run: |
          bash -n scripts/package_linux.sh scripts/smoke_linux_package.sh scripts/packaging/session-service.sh
          sh -n scripts/packaging/session-service.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          rustfmt --check scripts/packaging/windows-launcher.rs
          sed "s|/opt/nw-motion/bin/nw-motion|$PWD/target/release/nw-motion|" \
            scripts/packaging/nw-motion.service > "$RUNNER_TEMP/nw-motion.service"
          systemd-analyze --user verify "$RUNNER_TEMP/nw-motion.service"
          scripts/package_linux.sh --version "v$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)" \
            --arch x86_64 --format portable,deb,rpm,arch --dry-run
